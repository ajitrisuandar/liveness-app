<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Kamera - HRIS</title>
    <!-- Tailwind CSS untuk desain UI -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl text-center space-y-4">
        <h2 id="statusText" class="text-sm font-bold text-yellow-400">Menyiapkan Kamera...</h2>
        
        <!-- Kotak Tampilan Kamera -->
        <div class="relative w-full h-80 bg-black rounded-xl overflow-hidden border border-slate-700">
            <video id="webcam" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover transform -scale-x-100"></video>
        </div>

        <p id="instruction" class="text-xs text-slate-400">Posisikan wajah Anda di tengah bingkai.</p>
        
        <!-- Tombol tes sementara (Nanti akan otomatis saat fitur kedip dipasang) -->
        <button id="btnCaptureTest" onclick="captureAndSendPhoto()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl shadow-lg transition-all cursor-pointer">
            Ambil Foto & Kirim
        </button>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const statusText = document.getElementById('statusText');

        // 1. Nyalakan Kamera Depan Perangkat Pengguna
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 640 } } })
            .then(stream => {
                videoElement.srcObject = stream;
                statusText.innerText = "Kamera Siap!";
            })
            .catch(err => {
                console.error("Gagal akses kamera:", err);
                statusText.innerText = "Gagal Mengakses Kamera!";
                alert("Pastikan Anda memberikan izin akses kamera pada browser.");
            });

        // 2. Fungsi Mengambil Foto dan Mengirimkannya ke Aplikasi Utama
        function captureAndSendPhoto() {
            const canvas = document.createElement('canvas');
            canvas.width = videoElement.videoWidth || 640;
            canvas.height = videoElement.videoHeight || 640;
            const ctx = canvas.getContext('2d');
            
            // Efek mirror (dibalik agar tidak terbalik kiri-kanan)
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

            // Ubah ke format Base64 (JPEG)
            const base64Image = canvas.toDataURL('image/jpeg', 0.8);

            // Kirim balik pesan ke aplikasi utama (Google Apps Script)
            if (window.opener) {
                window.opener.postMessage({
                    type: 'LIVENESS_SUCCESS',
                    image: base64Image
                }, '*');
                
                // Tutup otomatis jendela popup setelah dikirim
                window.close();
            } else {
                alert("Jendela utama induk tidak ditemukan!");
            }
        }
    </script>
</body>
</html>
